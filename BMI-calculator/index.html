<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BMI Calculator</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f1f5f9;
			color: #172033;
			font-family: Arial, sans-serif;
		}
		.calculator {
			width: min(100%, 420px);
			padding: 32px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 12px 32px #17203318;
		}
		h1 { margin: 0 0 8px; font-size: 1.8rem; }
		.intro { margin: 0 0 24px; color: #64748b; line-height: 1.5; }
		label { display: block; margin: 16px 0 7px; font-weight: 600; }
		input {
			width: 100%;
			padding: 12px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			font: inherit;
		}
		input:focus { outline: 2px solid #2563eb; border-color: transparent; }
		button {
			width: 100%;
			margin-top: 22px;
			padding: 13px;
			border: 0;
			border-radius: 8px;
			background: #2563eb;
			color: white;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		.result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #eff6ff; }
		.result[hidden] { display: none; }
		.result strong { display: block; margin-bottom: 5px; font-size: 1.2rem; }
		.note { margin: 18px 0 0; color: #64748b; font-size: .85rem; line-height: 1.5; }
	</style>
</head>
<body>
	<main class="calculator">
		<h1>BMI Calculator</h1>
		<p class="intro">Enter your measurements to calculate your body mass index.</p>
		<form id="bmi-form">
			<label for="weight">Weight (kg)</label>
			<input id="weight" name="weight" type="number" min="1" step="any" placeholder="e.g. 70" required>

			<label for="height">Height (cm)</label>
			<input id="height" name="height" type="number" min="1" step="any" placeholder="e.g. 175" required>

			<button type="submit">Calculate BMI</button>
		</form>
		<section id="result" class="result" aria-live="polite" hidden></section>
		<p class="note">BMI is a general screening measure and is not a substitute for professional medical advice.</p>
	</main>
	<script src="script.js"></script>
</body>
</html>
